networks:
  common-net:
    name: common-net
    driver: bridge

services:
  nginx:
    image: nginx:1.31.3
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx
    depends_on:
      - "ragNode"
    links:
      - "ragNode:RagWeb"
    networks:
      - common-net

  ragNode:
    image: pm2:24.19.0
    container_name: ragNode
    expose:
      - "3000"
    volumes:
      - ./test_1:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Seoul
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    networks:
      - common-net
    #tty: true
    command: "tail -f /dev/null"
